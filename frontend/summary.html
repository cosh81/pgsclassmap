<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Allocation Summary
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

  <header class="topbar">

    <div>

      <h1>
        Allocation Summary
      </h1>

      <p>
        PGSClassMap
      </p>

    </div>

  </header>

  <main class="container">

    <section class="card">

      <div class="section-header">

        <h2>
          Overview
        </h2>

      </div>

      <div
        id="summaryGrid"
        class="summary-grid"
      ></div>

    </section>

    <section class="card">

      <div class="section-header">

        <h2>
          Pupil Allocation
        </h2>

      </div>

      <table id="allocationTable">

        <thead>

          <tr>

            <th>Pupil</th>
            <th>Class</th>
            <th>Gender</th>
            <th>Primary School</th>
            <th>Sibling Island</th>

          </tr>

        </thead>

        <tbody></tbody>

      </table>

    </section>

  </main>

  <script>

    const raw =
      sessionStorage.getItem(
        "lastAllocation"
      );

    if (!raw) {

      alert(
        "No allocation data found."
      );

    } else {

      const data =
        JSON.parse(raw);

      const summaryGrid =
        document.getElementById(
          "summaryGrid"
        );

      const allocationBody =
        document.querySelector(
          "#allocationTable tbody"
        );

      Object.entries(
        data.summary || {}
      ).forEach(
        ([className, details]) => {

          const card =
            document.createElement("div");

          card.className =
            "summary-card";

          card.innerHTML = `
            <h3>${className}</h3>

            <p>
              <strong>Total:</strong>
              ${details.total}
            </p>

            <p>
              <strong>Male:</strong>
              ${details.male}
            </p>

            <p>
              <strong>Female:</strong>
              ${details.female}
            </p>

            <p>
              <strong>Schools:</strong>
              ${Object.keys(
                details.schools || {}
              ).length}
            </p>
          `;

          summaryGrid.appendChild(card);

        }
      );

      (
        data.allocations || []
      ).forEach(row => {

        const tr =
          document.createElement("tr");

        tr.innerHTML = `
          <td>${row.pupil}</td>
          <td>${row.class}</td>
          <td>${row.gender}</td>
          <td>${row.primarySchool}</td>
          <td>${row.siblingIsland}</td>
        `;

        allocationBody.appendChild(tr);

      });

    }

  </script>

</body>
</html>
