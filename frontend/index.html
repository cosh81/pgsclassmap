<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PGS ClassMap</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="topbar">
    <div>
      <h1>PGS ClassMap</h1>
      <p>S1 Class Allocation</p>
    </div>
  </header>

  <main class="container">

    <section class="card">
      <div class="section-header">
        <h2>Upload Spreadsheet</h2>
      </div>

      <input type="file" id="pupilFile" accept=".xlsx,.xls">
    </section>

    <section class="grid-2">

      <div class="card">
        <div class="section-header">
          <h2>Class Setup</h2>
        </div>

        <table id="classTable">
          <thead>
            <tr>
              <th>Class Name</th>
              <th>Island</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <button class="secondary-btn" onclick="addClassRow()">Add Class</button>
      </div>

      <div class="card">
        <div class="section-header">
          <h2>Constraint Setup</h2>
        </div>

        <div class="form-group">
          <label>Minimum Class Size</label>
          <input type="number" id="minClassSize" value="28">
        </div>

        <div class="form-group">
          <label>Maximum Class Size</label>
          <input type="number" id="maxClassSize" value="32">
        </div>

        <div class="form-group">
          <label>Gender Balance</label>
          <select id="genderPriority">
            <option value="1">Very Low</option>
            <option value="2">Low</option>
            <option value="3" selected>Medium</option>
            <option value="4">High</option>
            <option value="5">Critical</option>
          </select>
        </div>

        <div class="form-group">
          <label>Friend Placement Priority</label>
          <select id="friendPriority">
            <option value="1">Very Low</option>
            <option value="2">Low</option>
            <option value="3">Medium</option>
            <option value="4" selected>High</option>
            <option value="5">Critical</option>
          </select>
        </div>

        <div class="form-group">
          <label>Primary School Spread</label>
          <select id="schoolPriority">
            <option value="1">Very Low</option>
            <option value="2">Low</option>
            <option value="3" selected>Medium</option>
            <option value="4">High</option>
            <option value="5">Critical</option>
          </select>
        </div>

        <div class="form-group">
          <label>Sibling Island Priority</label>
          <select id="siblingPriority">
            <option value="3">Medium</option>
            <option value="4">High</option>
            <option value="5" selected>Critical</option>
          </select>
        </div>
      </div>

    </section>

    <section class="card action-card">
      <div class="section-header">
        <h2>Generate Allocation</h2>
      </div>

      <div class="button-row">
        <button class="primary-btn" onclick="generateClasses()">Generate Classes</button>

        <button
  id="exportBtn"
  class="secondary-btn"
  disabled
  onclick="exportExcel()"
>
  Export Excel
</button>

        <button class="secondary-btn" disabled>View Classes</button>

        <button
  id="exportBtn"
  class="secondary-btn"
  disabled
  onclick="exportExcel()"
>
  Export Excel
</button>

      </div>
    </section>

    <details class="debug-panel">
      <summary>Developer Output</summary>
      <pre id="result">No output yet.</pre>
    </details>

  </main>

  <script src="app.js"></script>

</body>
</html>
